<main id="main"><section class="hero" id="home"><div class="wrap hero-grid"><div class="hero-copy"><p class="eyebrow">NORTHGO / CONNECTED LOGISTICS</p><h1>${t.hero}</h1><p class="lead">${t.lead}</p><div class="actions hero-actions">${button(action,'#contact','teal')}${button(t.explore,'#services','outline')}</div><div class="stats">${['1988','7','4'].map((n,i)=>`<div><strong>${n}</strong>${t.stats[i]}</div>`).join('')}</div></div><div class="hero-media"><img src="${PHOTO}" alt="${t.imageAlt}" width="900" height="900" fetchpriority="high"><span class="orbit" aria-hidden="true">↗</span><div class="hero-caption"><small>FROM ORIGIN TO DESTINATION</small>${t.heroCaption}</div></div></div></section>
<div class="ribbon"><div class="wrap"><span>${t.serviceNames.join(' · ')}</span><span>TAIWAN · JAPAN · VIETNAM · USA</span></div></div>

<section class="dark section" id="industries"><div class="wrap"><div class="sectionhead"><div><p class="eyebrow">02 / INDUSTRIES</p><h2>${t.industryTitle}</h2></div><p>${t.industryIntro}</p></div><div class="industry-grid">${t.industryNames.map((n,i)=>`<article class="industry"><span class="num">0${i+1}</span><h3>${n}</h3><p>${t.industryText[i]}</p><a href="#contact" class="service-enquire" data-service="${i===2?'freight':'project'}">${t.need}</a></article>`).join('')}</div></div></section>

<section class="pale section" id="locations"><div class="wrap"><div class="sectionhead"><div><p class="eyebrow">04 / GLOBAL OFFICES</p><h2>${t.locationsTitle}</h2></div><p>${t.locationsText}</p></div><div class="places">${t.officeNames.map(n=>'<span class="city">'+n+'</span>').join('')}</div><a href="northgo-global-offices.html?lang=${lang}" class="button outline" target="_blank" rel="noopener noreferrer">${t.openMap}</a><details class="embed-details" id="map-details"><summary>${t.showMap}</summary><iframe loading="lazy" data-src="northgo-global-offices.html?lang=${lang}" title="${t.nav[3]}"></iframe></details><p class="note">${t.mapNote}</p></div></section>
<section class="wrap section" id="sitemap"><div class="sitemap-layout"><div><p class="eyebrow">05 / WEBSITE ARCHITECTURE</p><h2>${t.sitemapTitle}</h2><p class="about-text">${t.sitemapText}</p><div class="actions">${button(t.fullMap,'northgo-sitemap.html?lang='+lang)}${button(t.treeMap,'northgo-sitemap-tree.html?lang='+lang,'outline')}</div></div><div class="mini-tree"><strong>NorthGo</strong><ul>${t.nav.map((n,i)=>`<li><a href="#${ids[i]}">${n}</a></li>`).join('')}<li><a href="#contact">${t.enquire}</a></li></ul></div></div><details class="embed-details" id="sitemap-details"><summary>${t.previewMap}</summary><iframe loading="lazy" data-src="northgo-sitemap-tree.html?lang=${lang}" title="${t.nav[4]}"></iframe></details></section>
<section class="pale section" id="contact"><div class="wrap"><div class="sectionhead"><div><p class="eyebrow">06 / ENQUIRY</p><h2>${t.contactTitle}</h2></div><p>${t.contactText}</p></div><div class="contact-layout"><form class="form" id="enquiry"><div class="fields">${['name','company','email','phone'].map((name,i)=>`<label class="field"><span>${t.fields[i]}${i<3?' *':''}</span><input name="${name}" id="${name}" ${i<3?'required':''} type="${i===2?'email':i===3?'tel':'text'}" autocomplete="${['name','organization','email','tel'][i]}" maxlength="200"></label>`).join('')}<label class="field"><span>${t.fields[4]} *</span><select name="service" id="service" required><option value="">${t.choose}</option>${t.serviceNames.map((n,i)=>`<option value="${serviceIds[i]}">${n}</option>`).join('')}</select></label><label class="field"><span>${t.fields[5]}</span><select name="office" id="office">${t.officeNames.map((n,i)=>`<option value="${emails[i]}">${n}</option>`).join('')}</select></label><div class="field wide" id="route"><div class="fields">${['origin','destination'].map((n,i)=>`<label class="field"><span>${t.fields[6+i]}</span><input name="${n}" id="${n}" maxlength="200"></label>`).join('')}</div></div><label class="field wide"><span>${t.fields[8]}</span><input name="cargo" id="cargo" maxlength="500"></label><label class="field wide"><span>${t.fields[9]} *</span><textarea name="message" id="message" required maxlength="4000"></textarea></label></div><p class="form-note">${t.formNote}</p><button class="button teal" type="submit">${t.prepare} ↗</button><section class="review" id="review" hidden aria-live="polite"><h3>${t.review}</h3><p>${t.notSent}</p><pre id="summary"></pre><div class="actions"><a class="button" href="mailto:info.tpe@northgo.com" id="send">${t.send}</a><button class="button outline" type="button" id="copy">${t.copy}</button></div></section></form><aside class="contact-aside"><p class="eyebrow">DIRECT CONTACT</p><h3>${t.direct}</h3><p><a href="tel:+886225318677">+886-2-2531-8677</a></p><p><a href="mailto:info.tpe@northgo.com">info.tpe@northgo.com</a></p><p>7F., No. 10, Sec. 3, Minsheng E. Rd., Taipei City 104511, Taiwan</p><p><a href="https://www.northgo.com${prefix}/contact" target="_blank" rel="noopener noreferrer">${t.source}</a></p></aside></div></div></section></main>
<footer class="footer"><div class="wrap"><div><a href="#home" aria-label="NorthGo"><img src="${LOGO}" alt="NorthGo" width="1070" height="210"></a><p>${t.footer}</p></div><div class="footer-links"><a href="northgo-sitemap.html?lang=${lang}">${t.nav[4]}</a><a href="https://www.northgo.com${prefix}/legal/privacy-policy">${t.privacy}</a><a href="https://www.northgo.com${prefix}/legal/terms">${t.terms}</a></div></div><div class="wrap copyright">REFERENCE DESIGN / 2026 · v1.1.0</div></footer>`;
document.querySelector('.menu').onclick=()=>{const open=document.getElementById('navlinks').classList.toggle('open');document.querySelector('.menu').setAttribute('aria-expanded',String(open));};document.querySelectorAll('.navlinks a').forEach(a=>a.onclick=()=>{document.getElementById('navlinks').classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');});
const form=document.getElementById('enquiry');for(const [k,v]of Object.entries(draft))if(form.elements[k])form.elements[k].value=v;
function route(){document.getElementById('route').hidden=!['freight','project'].includes(form.elements.service.value);}route();form.elements.service.onchange=route;
document.querySelectorAll('.service-enquire').forEach(a=>a.onclick=()=>{form.elements.service.value=a.dataset.service;route();});
document.getElementById('language').onchange=e=>{draft=Object.fromEntries(new FormData(form));lang=e.target.value;try{localStorage.setItem('northgo-language',lang);const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState(null,'',u);}catch{}render();};
document.querySelectorAll('.embed-details').forEach(d=>d.addEventListener('toggle',()=>{const frame=d.querySelector('iframe');if(d.open&&!frame.src)frame.src=frame.dataset.src;}));
form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;const data=new FormData(form);const fields=['name','company','email','phone','service','office','origin','destination','cargo','message'];summaryText=fields.map((k,i)=>{if((k==='origin'||k==='destination')&&document.getElementById('route').hidden)return '';const v=['service','office'].includes(k)?form.elements[k].selectedOptions[0].textContent:data.get(k);return v?t.fields[i]+': '+v:'';}).filter(Boolean).join('\n');document.getElementById('summary').textContent=summaryText;document.getElementById('send').href='mailto:'+data.get('office')+'?subject='+encodeURIComponent('NorthGo — '+form.elements.service.selectedOptions[0].textContent)+'&body='+encodeURIComponent(summaryText);document.getElementById('review').hidden=false;};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summaryText);document.getElementById('copy').textContent=t.copied;}catch{document.getElementById('copy').textContent=t.manual;}};
}render();
</script></body></html>
