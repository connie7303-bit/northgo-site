let architectureView=new URLSearchParams(location.search).get('view')==='current'?'current':'proposal';
const viewBar=document.createElement('div');viewBar.className='view-bar';viewBar.setAttribute('role','group');viewBar.innerHTML='<button type="button" id="view-current"></button><button type="button" id="view-proposal"></button>';document.querySelector('main').prepend(viewBar);
const planNotice=document.createElement('p');planNotice.className='plan-notice';document.querySelector('.section-head').after(planNotice);
const legend=document.createElement('div');legend.className='plan-legend';planNotice.after(legend);
const beforeUpgradeRender=render;
function plannedGroups(){const u=upgradeCopy[lang],t=text[lang];const serviceNames=pages.slice(3,7).map(p=>localizedNames[lang]?localizedNames[lang][pages.indexOf(p)]:(lang==='zh-tw'?p.zh:p.en));const policyNames=pages.slice(7).map(p=>localizedNames[lang]?localizedNames[lang][pages.indexOf(p)]:(lang==='zh-tw'?p.zh:p.en));
return [
[{name:u.overview,path:'/services',state:'add'},...pages.slice(3,7).map((p,i)=>({name:serviceNames[i],path:p.path,state:'improve',existing:p.path,details:u.serviceSpec}))],
[{name:u.industries,path:'/industries',state:'add'},...['offshore-energy','engineering-equipment','business-logistics'].map((s,i)=>({name:[u.offshore,u.engineering,u.business][i],path:'/industries/'+s,state:'add'})),{name:u.cases,path:'/case-studies',state:'add',details:u.caseSpec}],
[{name:u.about,path:'/about',state:'improve',existing:'/about'},{name:u.locations,path:'/locations',state:'add',details:u.locationSpec,map:true},{name:u.contact,path:'/contact',state:'improve',existing:'/contact',details:u.contactSpec}],
[...pages.slice(7).map((p,i)=>({name:policyNames[i],path:p.path,state:'retain',existing:p.path})),{name:u.sitemap,path:'/sitemap',state:'add'}]
];}
render=function(){beforeUpgradeRender();const u=upgradeCopy[lang],t=text[lang],proposal=architectureView==='proposal';document.getElementById('title').textContent=compact?t.shortTitle:u.title;document.title='Northgo | '+(compact?t.shortTitle:u.title);if(!compact)document.getElementById('subtitle').textContent=u.sub;
for(const v of ['current','proposal']){const b=document.getElementById('view-'+v);b.textContent=u[v];b.setAttribute('aria-pressed',String(v===architectureView));}viewBar.setAttribute('aria-label',u.title);document.body.classList.toggle('proposal',proposal);planNotice.hidden=!proposal;legend.hidden=!proposal;planNotice.textContent=u.note;legend.innerHTML='<span>'+u.legend+'</span>'+['add','improve','retain'].map(s=>`<span class="plan-badge ${s}">${u[s]}</span>`).join('');
const link=document.getElementById('alternate');link.href+='&view='+architectureView;
document.querySelectorAll('.stat strong').forEach((e,i)=>e.textContent=[11,4,1][i]);if(proposal){const groups=plannedGroups(),total=1+groups.flat().length;document.querySelectorAll('.stat strong').forEach((e,i)=>e.textContent=[total,4,4][i]);document.getElementById('pages-label').textContent=u.count;document.getElementById('services-label').textContent=u.langs;document.getElementById('errors-label').textContent=u.phases;document.getElementById('structure').textContent=u.plan;document.getElementById('intro').textContent=u.localeNote;
document.getElementById('tree').innerHTML=`<div class="root"><span class="planned-home">${t.home}</span><span class="path">${u.homeSpec}</span></div><div class="branches">${groups.map((group,i)=>`<section class="group"><h3>${u.groups[i]}</h3><ul class="nodes">${group.map(p=>`<li class="node"><span class="planned-name">${p.name}</span> <span class="plan-badge ${p.state}">${u[p.state]}</span><code class="path">${localePrefix()}${p.path}</code>${!compact&&p.existing?`<a class="original-page" href="${url(p.existing)}" target="_blank" rel="noopener noreferrer">${u.source}</a>`:''}${!compact&&p.map?`<a class="original-page" href="northgo-global-offices.html?lang=${lang}">${t.map} ↗</a>`:''}${p.details?`<details ${expanded?'open':''}><summary>${u.detail}</summary><ul>${p.details.map(s=>'<li>'+s+'</li>').join('')}</ul></details>`:''}</li>`).join('')}</ul></section>`).join('')}</div>`;
document.getElementById('notice').textContent=u.news;document.getElementById('compact-localization').textContent=u.localeNote;document.getElementById('observations-title').textContent=u.roadmap;document.getElementById('observations').innerHTML=u.steps.map(s=>'<li>'+s+'</li>').join('');document.getElementById('recommendations-title').textContent=u.rules;document.getElementById('recommendations').innerHTML=u.checks.map(s=>'<li>'+s+'</li>').join('');}
};
function saveView(){try{const u=new URL(location);u.searchParams.set('view',architectureView);history.replaceState(null,'',u);}catch{}}
['current','proposal'].forEach(v=>document.getElementById('view-'+v).onclick=()=>{architectureView=v;saveView();render();document.getElementById('status').textContent=upgradeCopy[lang][v];});render();
</script></body></html>
